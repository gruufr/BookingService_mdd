services:
  booking-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CONNECTION_STRING=Host=db;Port=5432;Database=app;Username=postgres;Password=1234
    depends_on:
      - db
      - notification-service
    restart: always

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    restart: always

  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    restart: always

  db:
    image: postgres:16
    container_name: booking_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
