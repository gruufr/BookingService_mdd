# web — статика сайта + API-шлюз.
# /api/hotels, /api/rooms      → hotel-service
# /api/bookings, /api/availability → booking-service
# /api/users                   → user-service
# /api/notifications           → notification-service
# /api/health/<service>        → /health нужного сервиса (для страницы «Система»)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # HTTP/1.1 к сервисам: иначе Kestrel отвечает 400 на POST без тела (например, отмена брони).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/api/(hotels|rooms)(.*)$ {
        set $up http://hotel-service:8083;
        proxy_pass $up/$1$2$is_args$args;
    }
    location ~ ^/api/(bookings|availability)(.*)$ {
        set $up http://booking-service:8080;
        proxy_pass $up/$1$2$is_args$args;
    }
    location ~ ^/api/(users)(.*)$ {
        set $up http://user-service:8081;
        proxy_pass $up/$1$2$is_args$args;
    }
    location ~ ^/api/(notifications)(.*)$ {
        set $up http://notification-service:8082;
        proxy_pass $up/$1$2$is_args$args;
    }
    location = /api/health/booking      { set $up http://booking-service:8080;      proxy_pass $up/health; proxy_connect_timeout 2s; }
    location = /api/health/hotel        { set $up http://hotel-service:8083;        proxy_pass $up/health; proxy_connect_timeout 2s; }
    location = /api/health/user         { set $up http://user-service:8081;         proxy_pass $up/health; proxy_connect_timeout 2s; }
    location = /api/health/notification { set $up http://notification-service:8082; proxy_pass $up/health; proxy_connect_timeout 2s; }

    # Скрипты и стили не кэшировать надолго (иначе Cloudflare держит старые версии).
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location /img/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
